<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0A2540" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="100" cy="100" r="93" fill="url(#codeLogo)"/>
  
  <!-- Code-style: &lt;S/&gt; -->
  <text x="100" y="125" font-family="'Monaco', 'Courier New', monospace" font-size="54" font-weight="600" text-anchor="middle" fill="#00D4FF">&lt;</text>
  <text x="130" y="125" font-family="'Poppins', sans-serif" font-size="62" font-weight="700" text-anchor="middle" fill="white">S</text>
  <text x="162" y="125" font-family="'Monaco', 'Courier New', monospace" font-size="54" font-weight="600" text-anchor="middle" fill="#00D4FF">/&gt;</text>
</svg>