<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2540;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0A2540" stroke="#00D4FF" stroke-width="2"/>
  
  <!-- Subtle gradient overlay -->
  <circle cx="100" cy="100" r="93" fill="url(#logoGradient)"/>
  
  <!-- Monogram Text "SM" -->
  <text x="100" y="115" font-family="'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="white" letter-spacing="2">SM</text>
  
  <!-- Accent: subtle cyan dot at top right -->
  <circle cx="155" cy="50" r="3.5" fill="#00D4FF" filter="url(#glow)"/>
</svg>